<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Analytics - Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Student Analytics</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/students.html">Students</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/add_student.html">Add Student</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analytics.html">Analytics</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Edit Student</h1>
        <form id="editStudentForm">
            <div class="mb-3">
                <label for="studentName" class="form-label">Student Name</label>
                <input type="text" class="form-control" id="studentName" required>
            </div>
            <div class="mb-3">
                <label for="studentAge" class="form-label">Age</label>
                <input type="number" class="form-control" id="studentAge" required>
            </div>
            <div class="mb-3">
                <label for="studentGrade" class="form-label">Grade</label>
                <input type="text" class="form-control" id="studentGrade" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Student</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const studentId = urlParams.get('id');

            if (!studentId) {
                alert('No student ID provided.');
                window.location.href = '/students.html';
                return;
            }

            // Fetch student data
            fetch(`/api/students/${studentId}`)
                .then(response => response.json())
                .then(student => {
                    if (student.error) {
                        alert('Error: ' + student.error);
                        window.location.href = '/students.html';
                        return;
                    }
                    document.getElementById('studentName').value = student.name;
                    document.getElementById('studentAge').value = student.age;
                    document.getElementById('studentGrade').value = student.grade;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while fetching student data.');
                    window.location.href = '/students.html';
                });

            // Handle form submission
            document.getElementById('editStudentForm').addEventListener('submit', function(event) {
                event.preventDefault();

                const studentName = document.getElementById('studentName').value;
                const studentAge = document.getElementById('studentAge').value;
                const studentGrade = document.getElementById('studentGrade').value;

                fetch(`/api/students/${studentId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: studentName,
                        age: studentAge,
                        grade: studentGrade
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert(data.message);
                        window.location.href = '/students.html';
                    } else {
                        alert('Error: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while updating the student.');
                });
            });
        });
    </script>
</body>
</html>
