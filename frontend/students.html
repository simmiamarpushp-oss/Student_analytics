<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Analytics - Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Student Analytics</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/students.html">Students</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/add_student.html">Add Student</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analytics.html">Analytics</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Student List</h1>
        <div class="d-flex justify-content-end mb-3">
            <button class="btn btn-info" onclick="refreshAnalytics()">Refresh Analytics & AI Insights</button>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Grade</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="student-list">
                <!-- Student data will be inserted here -->
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/students')
                .then(response => response.json())
                .then(data => {
                    const studentList = document.getElementById('student-list');
                    if (data.length === 0) {
                        studentList.innerHTML = '<tr><td colspan="5" class="text-center">No students found.</td></tr>';
                        return;
                    }
                    data.forEach(student => {
                        const row = `<tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.age}</td>
                            <td>${student.grade}</td>
                            <td>
                                <a href="/edit_student.html?id=${student.id}" class="btn btn-warning btn-sm">Edit</a>
                                <button class="btn btn-danger btn-sm" onclick="deleteStudent(${student.id})">Delete</button>
                            </td>
                        </tr>`;
                        studentList.innerHTML += row;
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                    const studentList = document.getElementById('student-list');
                    studentList.innerHTML = '<tr><td colspan="5" class="text-center">Error loading students.</td></tr>';
                });
        });

        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                fetch(`/api/students/${id}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert(data.message);
                        location.reload();
                    } else {
                        alert('Error: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while deleting the student.');
                });
            }
        }

        function refreshAnalytics() {
            // Show a loading message to the user
            alert('Generating new analytics report. This may take a moment...');
            fetch('/api/analytics/generate', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(result => {
                if (result.message) {
                    alert(result.message + ' You can now view the updated data on the Dashboard.');
                } else {
                    // Provide a more detailed error message
                    let errorMessage = 'Error generating analytics. Please check the backend server logs for more details.';
                    if (result.error) {
                        errorMessage += '\n\nDetails: ' + result.error;
                    }
                    alert(errorMessage);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('A network error occurred. Could not reach the server.');
            });
        }
    </script>
</body>
</html>
