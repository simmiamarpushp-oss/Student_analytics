<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Analytics - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Student Analytics</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/students.html">Students</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/add_student.html">Add Student</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analytics.html">Analytics</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Dashboard</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-header">
                        Total Students
                    </div>
                    <div class="card-body">
                        <h5 class="card-title" id="total-students">Loading...</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-header">
                        Average Age
                    </div>
                    <div class="card-body">
                        <h5 class="card-title" id="average-age">Loading...</h5>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <canvas id="students-per-grade-chart"></canvas>
        </div>

        <div class="mt-4">
            <div class="card">
                <div class="card-header">
                    AI Insights
                </div>
                <div class="card-body">
                    <p class="card-text" id="ai-insights">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/analytics')
                .then(response => response.json())
                .then(data => {
                    // Update KPIs
                    document.getElementById('total-students').textContent = data.total_students;
                    document.getElementById('average-age').textContent = data.average_age;
                    document.getElementById('ai-insights').textContent = data.ai_insights;

                    // Create Chart
                    const ctx = document.getElementById('students-per-grade-chart').getContext('2d');
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: Object.keys(data.students_per_grade),
                            datasets: [{
                                label: 'Number of Students',
                                data: Object.values(data.students_per_grade),
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                borderColor: 'rgba(75, 192, 192, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Failed to load analytics data.');
                });
        });
    </script>
</body>
</html>
